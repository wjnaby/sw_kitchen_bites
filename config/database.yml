default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: root
  password: MyNewPass123!
  host: localhost
  socket: /var/run/mysqld/mysqld.sock

development:
  <<: *default
  database: sw_kitchen_bites_development

test:
  <<: *default
  database: sw_kitchen_bites_test

production:
  <<: *default
  database: sw_kitchen_bites_production
